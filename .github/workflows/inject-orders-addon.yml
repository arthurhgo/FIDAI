name: Inject FIDAI orders addon

on:
  push:
    branches:
      - agent/pedidos-pix-admin
    paths:
      - assets/fidai-orders.js
      - .github/workflows/inject-orders-addon.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pedidos-pix-admin
      - name: Add orders module to index
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          tag = '<script defer src="./assets/fidai-orders.js"></script>'
          if tag not in html:
              html = html.replace('</body>', f'{tag}</body>')
              path.write_text(html)
          PY
      - name: Commit generated index
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load PIX orders addon"
          git push
